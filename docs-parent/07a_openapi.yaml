openapi: 3.0.3
info:
  title: TouringProjectV2 Backend API
  version: 1.0.0
  description: >
    App ↔ Backend の約束の正本（親リポジトリ docs/07_units_contracts.md UC-4〜UC-7）。
    /health 以外は x-api-key（接続キー）と x-user-name（英小文字と数字の3〜20文字）が要る。
    5xx（API Gateway・Lambda の一時的な失敗）は送り直してよい。PUT・DELETE は何度送っても同じ結果になる。
    文字数の上限は、前後の空白を落としたあとの Unicode のコードポイントの数で数える。
servers:
  - url: https://{apiId}.execute-api.ap-northeast-1.amazonaws.com/Prod
    variables:
      apiId:
        default: example
security:
  - ApiKey: []
paths:
  /health:
    get:
      summary: 死活の確認
      security: []
      responses:
        "200":
          description: 動いている
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
  /asks:
    post:
      summary: 質問を受け付ける（回答は GET /asks/{askId} で取りに行く）
      parameters:
        - $ref: "#/components/parameters/UserName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "202":
          description: 受け付けた
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: 接続キーが無効
        "429":
          description: 流量の制限
        "503":
          description: 受け付けたが処理に回せなかった。記録は残さない。App は通信の失敗と同じに扱う
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [unavailable]
  /asks/{askId}:
    get:
      summary: 質問の状態と回答
      parameters:
        - $ref: "#/components/parameters/UserName"
        - name: askId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: 接続キーが無効
        "404":
          description: 無い（他のユーザーの質問も無いものとして扱う）
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [not_found]
    delete:
      summary: 質問を消し、削除の跡を残す（何度呼んでも、無い質問でも 204）
      parameters:
        - $ref: "#/components/parameters/UserName"
        - $ref: "#/components/parameters/AskId"
      responses:
        "204":
          description: 消した
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: 接続キーが無効
  /asks/{askId}/memo:
    put:
      summary: 会話のメモを置く（memo が null なら消す）
      description: updatedAt が保存済みの memoUpdatedAt より新しいときだけ書く。古ければ何もせず 200（applied は false）。
      parameters:
        - $ref: "#/components/parameters/UserName"
        - $ref: "#/components/parameters/AskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskMemoRequest"
      responses:
        "200":
          description: 受け取った（書いたか、古いので何もしなかったか）
          content:
            application/json:
              schema:
                type: object
                required: [askId, applied]
                properties:
                  askId:
                    type: string
                    format: uuid
                  applied:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: 接続キーが無効
        "404":
          description: 質問が無い（他のユーザーの質問も無いものとして扱う）
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [not_found]
        "410":
          $ref: "#/components/responses/Deleted"
  /asks/{askId}/offline:
    put:
      summary: 質問できなかった地点を置く（Backend に届かなかった質問。最新の全体を送る）
      description: >
        Android が作った askId で、status が offline の質問として置く。updatedAt が保存済みのものより新しいときだけ書き、
        古ければ何もせず 200（applied は false）で、保存済みの住所と方位を返す。会話のメモ（PUT /asks/{askId}/memo）は残す。
        住所（町名まで）と方位は最初に受けたときに Backend が決め、あとの PUT では変えない（住所を確定できなかったときは次の PUT で求め直す）。
        質問か走行に削除の跡があれば、書かずに 410。同じ askId で Backend が受け付けた質問があれば、書かずに 409。
      parameters:
        - $ref: "#/components/parameters/UserName"
        - $ref: "#/components/parameters/AskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfflineAskRequest"
      responses:
        "200":
          description: 受け取った（書いたか、古いので何もしなかったか）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfflineAskSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: 接続キーが無効
        "409":
          description: 同じ askId で Backend が受け付けた質問がある。書かなかった
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [conflict]
        "410":
          $ref: "#/components/responses/Deleted"
  /records:
    get:
      summary: ユーザーの記録を、ページ送りで読む（引き継ぎのときに使う）
      description: >
        走行・ルートのかたまり・地点メモ・質問（質問できなかった地点を含む）・削除の跡を、記録の識別子の順に返す。
        1ページは DynamoDB の1回の問い合わせ（最大1MB）で、items が空でも cursor があれば続きがある。
        cursor が null なら最後のページ。強い一貫性で読む。
      parameters:
        - $ref: "#/components/parameters/UserName"
        - name: cursor
          in: query
          required: false
          description: 前のページの応答の cursor。最初のページでは付けない
          schema:
            type: string
      responses:
        "200":
          description: 1ページ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordsPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: 接続キーが無効
  /rides/{rideId}:
    put:
      summary: 走行のメタ情報を置く（状態・名前・区間・メモが変わるたびに、最新の全体を送る）
      description: >
        updatedAt が保存済みのものより新しいときだけ上書きする。古ければ何もせず 200（applied は false）。
        削除の跡がある走行は書かずに 410。読み出しは GET /records。
      parameters:
        - $ref: "#/components/parameters/UserName"
        - $ref: "#/components/parameters/RideId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RideRequest"
      responses:
        "200":
          description: 受け取った（保存したか、古いので何もしなかったか）
          content:
            application/json:
              schema:
                type: object
                required: [rideId, applied]
                properties:
                  rideId:
                    type: string
                    format: uuid
                  applied:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: 接続キーが無効
        "410":
          $ref: "#/components/responses/Deleted"
    delete:
      summary: 走行を消し、削除の跡を残す（ルート・地点メモ・その走行の質問も消し、地点メモと質問にも跡を残す）
      description: 何度呼んでも、無い走行でも 204。
      parameters:
        - $ref: "#/components/parameters/UserName"
        - $ref: "#/components/parameters/RideId"
      responses:
        "204":
          description: 消した
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: 接続キーが無効
  /rides/{rideId}/route/{seq}:
    put:
      summary: ルートの点のかたまりを置く（同じ seq は丸ごと上書き。削除の跡がある走行は 410）
      parameters:
        - $ref: "#/components/parameters/UserName"
        - $ref: "#/components/parameters/RideId"
        - name: seq
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 99999
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteChunk"
      responses:
        "200":
          description: 保存した
          content:
            application/json:
              schema:
                type: object
                required: [rideId, seq]
                properties:
                  rideId:
                    type: string
                    format: uuid
                  seq:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: 接続キーが無効
        "410":
          $ref: "#/components/responses/Deleted"
  /rides/{rideId}/notes/{noteId}:
    put:
      summary: 地点メモを置く（最新の全体を送る）
      description: >
        updatedAt が保存済みのものより新しいときだけ書く。古ければ何もせず 200（applied は false）で、保存済みの住所と方位を返す。
        住所（町名まで）と方位は最初に受けたときに Backend が決め、あとの PUT では変えない（住所を確定できなかったときは次の PUT で求め直す）。
        地点メモか走行に削除の跡があれば、書かずに 410。走行のメタ情報より先に届いてもよい。
      parameters:
        - $ref: "#/components/parameters/UserName"
        - $ref: "#/components/parameters/RideId"
        - $ref: "#/components/parameters/NoteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteRequest"
      responses:
        "200":
          description: 受け取った（書いたか、古いので何もしなかったか）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: 接続キーが無効
        "410":
          $ref: "#/components/responses/Deleted"
    delete:
      summary: 地点メモを消し、削除の跡を残す（何度呼んでも、無い地点メモでも 204）
      parameters:
        - $ref: "#/components/parameters/UserName"
        - $ref: "#/components/parameters/RideId"
        - $ref: "#/components/parameters/NoteId"
      responses:
        "204":
          description: 消した
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: 接続キーが無効
  /transcriptions:
    post:
      summary: 地点メモの声を文字にするだけの依頼を受け付ける（AI は呼ばない。結果は GET /transcriptions/{transcriptionId}）
      parameters:
        - $ref: "#/components/parameters/UserName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptionRequest"
      responses:
        "202":
          description: 受け付けた
          content:
            application/json:
              schema:
                type: object
                required: [transcriptionId]
                properties:
                  transcriptionId:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: 接続キーが無効
        "429":
          description: 流量の制限
  /transcriptions/{transcriptionId}:
    get:
      summary: 文字起こしの状態と結果（受け付けてから1日で消える）
      parameters:
        - $ref: "#/components/parameters/UserName"
        - name: transcriptionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: 接続キーが無効
        "404":
          description: 無い（他のユーザーのもの・1日を過ぎたものも無いものとして扱う）
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [not_found]
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-api-key
  parameters:
    UserName:
      name: x-user-name
      in: header
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]{3,20}$"
    RideId:
      name: rideId
      in: path
      required: true
      description: Android が作る UUID（小文字）
      schema:
        type: string
        format: uuid
    NoteId:
      name: noteId
      in: path
      required: true
      description: Android が作る UUID（小文字）
      schema:
        type: string
        format: uuid
    AskId:
      name: askId
      in: path
      required: true
      description: Backend が質問を受け付けたときに返した UUID（小文字）。質問できなかった地点は Android が作る UUID
      schema:
        type: string
        format: uuid
  responses:
    Deleted:
      description: 削除の跡がある（記録か、その走行が消されている）。書かなかった。App は送れたものとして扱い、送り直さない
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
                enum: [deleted]
    BadRequest:
      description: 入力が不正
      content:
        application/json:
          schema:
            type: object
            required: [error, message]
            properties:
              error:
                type: string
                enum: [bad_request]
              message:
                type: string
  schemas:
    Point:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    AskRequest:
      type: object
      description: audio と text はどちらか一方。不正な location・headingDegrees・headingSample は無いものとして扱う。
      properties:
        audio:
          type: string
          format: byte
          description: PCM（16kHz・モノラル・16bit リトルエンディアン）の base64（改行と空白は無視する）。0.25〜60秒。
        text:
          type: string
          minLength: 1
          maxLength: 500
        location:
          allOf:
            - $ref: "#/components/schemas/Point"
          nullable: true
        headingDegrees:
          type: number
          nullable: true
          description: 進行方位（真北から時計回りの度数。0以上360未満）。Android が走行のルートから求める。方位なしなら null。0以上360未満の数でなければ方位なしとして扱う。headingSample より優先する
        headingSample:
          nullable: true
          description: 古い形の方位の材料。少し前の位置と、その時刻（タイムゾーン付き）。headingDegrees が無いときだけ使い、2分より古いものは使わない。端末に残った古い未送信のために受ける。
          allOf:
            - $ref: "#/components/schemas/Point"
            - type: object
              required: [at]
              properties:
                at:
                  type: string
                  format: date-time
        conversationId:
          type: string
          format: uuid
          nullable: true
          description: 会話を続けるときだけ送る（小文字）。
        volumeDb:
          type: integer
          enum: [0, 3, 6]
          default: 6
          description: 回答の音声を上げる量（dB）。利用者が設定で選ぶ。Polly は +6dB で頭打ちになるので、6 が最大。
        rideId:
          type: string
          format: uuid
          nullable: true
          description: 走行の記録中に始めた質問だけに付ける（小文字）。一時停止中・記録していないときは付けない。
    AskAccepted:
      type: object
      required: [askId, conversationId, conversationExpiresAt]
      properties:
        askId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        conversationExpiresAt:
          type: string
          format: date-time
          description: この時刻を過ぎたら App は conversationId を捨てる。
    AskResult:
      type: object
      required: [askId, status, audio, timings]
      properties:
        askId:
          type: string
          format: uuid
        status:
          type: string
          enum: [processing, completed, failed, offline]
          description: offline は質問できなかった地点（PUT /asks/{askId}/offline で置いたもの）。処理されないので、回答は来ない
        transcript:
          type: string
          nullable: true
        answer:
          type: string
          nullable: true
          description: tts_failed のときも入る（端末の音声合成で読む）。
        audio:
          type: array
          description: 読み上げ音声。seq の順に鳴らす。URL は10分有効。
          items:
            type: object
            required: [seq, url]
            properties:
              seq:
                type: integer
              url:
                type: string
                format: uri
        error:
          type: string
          nullable: true
          enum: [no_speech, transcribe_failed, agent_failed, tts_failed, null]
        timings:
          type: object
          additionalProperties:
            type: string
            format: date-time
        askedAt:
          type: string
          format: date-time
          nullable: true
          description: 受け付けた日時（UTC）
        address:
          type: string
          nullable: true
          description: 質問した地点の住所。確定できなかったら null
        headingDegrees:
          type: number
          nullable: true
          description: 進行方位（北を0とする度）。方位なしなら null
    RideRequest:
      type: object
      required: [name, status, segments, autoEnded, updatedAt]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        status:
          type: string
          enum: [recording, paused, ended]
        segments:
          type: array
          minItems: 1
          maxItems: 1000
          description: 記録した区間の並び。記録中の走行だけ、最後の区間の endedAt が null。重なってはいけない。
          items:
            type: object
            required: [startedAt, endedAt]
            properties:
              startedAt:
                type: string
                format: date-time
              endedAt:
                type: string
                format: date-time
                nullable: true
        autoEnded:
          type: boolean
          description: 最長時間で自動で終了したか（終了した走行だけ true にできる）
        updatedAt:
          type: string
          format: date-time
          description: >
            Android が変更した時刻（タイムゾーン付き）。ミリ秒まで比べ、それより細かい部分は切り捨てる。
            保存済みと同じミリ秒の版は新しいとみなさない（Android は端末のミリ秒の時刻を送るので、それより細かい差は来ない）。
        memo:
          type: string
          maxLength: 2000
          nullable: true
          description: 走行のメモ。null・省略・空白だけは「メモ無し」（保存済みのメモも消える）。前後の空白は落とし、そのあとのコードポイントで2000まで
    AskMemoRequest:
      type: object
      required: [memo, updatedAt]
      properties:
        memo:
          type: string
          maxLength: 2000
          nullable: true
          description: 会話のメモ。null・空白だけなら消す。前後の空白は落とし、そのあとのコードポイントで2000まで
        updatedAt:
          type: string
          format: date-time
          description: Android がメモを変えた時刻（タイムゾーン付き。ミリ秒まで比べる）
    NoteRequest:
      type: object
      required: [at, text, updatedAt]
      properties:
        at:
          type: string
          format: date-time
          description: 地点メモを開いた時刻（タイムゾーン付き）
        location:
          allOf:
            - $ref: "#/components/schemas/Point"
          nullable: true
          description: 開いたときの位置。まだ位置が無ければ null。不正な位置は 400
        headingDegrees:
          type: number
          nullable: true
          description: 進行方位（真北から時計回りの度数。0以上360未満）。Android が走行のルートから求める。方位なしなら null。0以上360未満の数でなければ方位なしとして扱う。headingSample より優先する
        headingSample:
          nullable: true
          description: 古い形の方位の材料（質問と同じ）。headingDegrees が無いときだけ使い、at より2分以上古いものは使わない。不正なものは無いものとして扱う
          allOf:
            - $ref: "#/components/schemas/Point"
            - type: object
              required: [at]
              properties:
                at:
                  type: string
                  format: date-time
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: 本文。空白だけは 400。前後の空白は落とし、そのあとのコードポイントで2000まで
        updatedAt:
          type: string
          format: date-time
          description: Android が地点メモを変えた時刻（タイムゾーン付き。ミリ秒まで比べる）
    NoteSaved:
      type: object
      required: [noteId, applied, address, headingDegrees]
      properties:
        noteId:
          type: string
          format: uuid
        applied:
          type: boolean
        address:
          type: string
          nullable: true
          description: 地点の住所（町名まで）。位置が無いか、確定できなかったら null
        headingDegrees:
          type: number
          nullable: true
          description: 進行方位（北を0とする度）。方位なしなら null
    TranscriptionRequest:
      type: object
      required: [audio]
      properties:
        audio:
          type: string
          format: byte
          description: PCM（16kHz・モノラル・16bit リトルエンディアン）の base64（改行と空白は無視する）。0.25〜60秒。文字にしたら消す
    TranscriptionResult:
      type: object
      required: [transcriptionId, status, text, failure]
      properties:
        transcriptionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [processing, done, failed]
        text:
          type: string
          nullable: true
          description: 聞き取った文（done のときだけ）
        failure:
          type: string
          nullable: true
          enum: [no_speech, transcribe_failed, null]
    RouteChunk:
      type: object
      required: [points]
      properties:
        points:
          type: array
          minItems: 1
          maxItems: 300
          items:
            type: object
            required: [t, lat, lon, accuracy, segment]
            properties:
              t:
                type: string
                format: date-time
              lat:
                type: number
                minimum: -90
                maximum: 90
              lon:
                type: number
                minimum: -180
                maximum: 180
              accuracy:
                type: number
                minimum: 0
                nullable: true
              segment:
                type: integer
                minimum: 0
                description: 点を記録した区間の番号（segments の何番目か。0から）
    OfflineAskRequest:
      type: object
      required: [askedAt, rideId, updatedAt]
      properties:
        askedAt:
          type: string
          format: date-time
          description: 録音を終えた時刻（タイムゾーン付き）
        location:
          allOf:
            - $ref: "#/components/schemas/Point"
          nullable: true
          description: 録音を終えたときの位置。まだ位置が無ければ null。不正な位置は 400。最初に位置を受けたあとは、あとの版の位置を使わない（住所・方位と同じ）
        headingDegrees:
          type: number
          nullable: true
          description: 進行方位（真北から時計回りの度数。0以上360未満）。Android が走行のルートから求める。方位なしなら null。0以上360未満の数でなければ方位なしとして扱う。headingSample より優先する
        headingSample:
          nullable: true
          description: 古い形の方位の材料（質問と同じ）。headingDegrees が無いときだけ使い、askedAt より2分以上古いものは使わない。不正なものは無いものとして扱う
          allOf:
            - $ref: "#/components/schemas/Point"
            - type: object
              required: [at]
              properties:
                at:
                  type: string
                  format: date-time
        rideId:
          type: string
          format: uuid
          description: 記録中だった走行（小文字）
        updatedAt:
          type: string
          format: date-time
          description: Android が記録を変えた時刻（タイムゾーン付き。ミリ秒まで比べる）
    OfflineAskSaved:
      type: object
      required: [askId, applied, address, headingDegrees]
      properties:
        askId:
          type: string
          format: uuid
        applied:
          type: boolean
        address:
          type: string
          nullable: true
          description: 地点の住所（町名まで）。位置が無いか、確定できなかったら null
        headingDegrees:
          type: number
          nullable: true
          description: 進行方位（北を0とする度）。方位なしなら null
    RecordsPage:
      type: object
      required: [items, cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecordItem"
        cursor:
          type: string
          nullable: true
          description: 続きを読むときに付ける。null なら最後のページ
    RecordItem:
      oneOf:
        - $ref: "#/components/schemas/RideRecord"
        - $ref: "#/components/schemas/RouteRecord"
        - $ref: "#/components/schemas/NoteRecord"
        - $ref: "#/components/schemas/AskRecord"
        - $ref: "#/components/schemas/DeletedRecord"
      discriminator:
        propertyName: kind
        mapping:
          ride: "#/components/schemas/RideRecord"
          route: "#/components/schemas/RouteRecord"
          note: "#/components/schemas/NoteRecord"
          ask: "#/components/schemas/AskRecord"
          deleted: "#/components/schemas/DeletedRecord"
    RideRecord:
      type: object
      description: PUT /rides/{rideId} で置いたもの
      required: [kind, rideId, name, status, segments, autoEnded, updatedAt, memo]
      properties:
        kind:
          type: string
          enum: [ride]
        rideId:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [recording, paused, ended]
        segments:
          type: array
          items:
            type: object
            required: [startedAt, endedAt]
            properties:
              startedAt:
                type: string
                format: date-time
              endedAt:
                type: string
                format: date-time
                nullable: true
        autoEnded:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        memo:
          type: string
          nullable: true
    RouteRecord:
      type: object
      description: PUT /rides/{rideId}/route/{seq} で置いたもの
      required: [kind, rideId, seq, points]
      properties:
        kind:
          type: string
          enum: [route]
        rideId:
          type: string
          format: uuid
        seq:
          type: integer
        points:
          $ref: "#/components/schemas/RouteChunk/properties/points"
    NoteRecord:
      type: object
      description: PUT /rides/{rideId}/notes/{noteId} で置いたものと、Backend が決めた住所と方位
      required: [kind, rideId, noteId, at, location, text, updatedAt, address, headingDegrees]
      properties:
        kind:
          type: string
          enum: [note]
        rideId:
          type: string
          format: uuid
        noteId:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        location:
          allOf:
            - $ref: "#/components/schemas/Point"
          nullable: true
        text:
          type: string
        updatedAt:
          type: string
          format: date-time
        address:
          type: string
          nullable: true
        headingDegrees:
          type: number
          nullable: true
    AskRecord:
      type: object
      description: >
        質問。Backend が受け付けたもの（status は GET /asks/{askId} と同じ）と、質問できなかった地点（status が offline）。
      required: [kind, askId, status, askedAt, question, transcript, answer, error, answeredAt, location, address,
                 headingDegrees, inputType, conversationId, newConversation, rideId, memo, memoUpdatedAt, updatedAt]
      properties:
        kind:
          type: string
          enum: [ask]
        askId:
          type: string
          format: uuid
        status:
          type: string
          enum: [processing, completed, failed, offline]
        askedAt:
          type: string
          format: date-time
          nullable: true
          description: 受け付けた日時。質問できなかった地点は録音を終えた時刻
        question:
          type: string
          nullable: true
          description: 文字の質問の文
        transcript:
          type: string
          nullable: true
        answer:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
          enum: [no_speech, transcribe_failed, agent_failed, tts_failed, null]
        answeredAt:
          type: string
          format: date-time
          nullable: true
          description: 回答ができた時刻（聞ける回答があるときだけ）
        location:
          allOf:
            - $ref: "#/components/schemas/Point"
          nullable: true
        address:
          type: string
          nullable: true
        headingDegrees:
          type: number
          nullable: true
        inputType:
          type: string
          nullable: true
          enum: [audio, text, null]
          description: 質問できなかった地点は null
        conversationId:
          type: string
          format: uuid
          nullable: true
          description: 質問できなかった地点は null
        newConversation:
          type: boolean
          description: 会話の最初の質問か（その直前で会話が区切れる）
        rideId:
          type: string
          format: uuid
          nullable: true
        memo:
          type: string
          nullable: true
        memoUpdatedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Android が変えた時刻（質問できなかった地点だけ）
    DeletedRecord:
      type: object
      description: 削除の跡。target の記録は消えている（走行の跡なら、その下のルート・地点メモ・質問も）
      required: [kind, target, id, rideId, deletedAt]
      properties:
        kind:
          type: string
          enum: [deleted]
        target:
          type: string
          enum: [ask, ride, note]
        id:
          type: string
          format: uuid
        rideId:
          type: string
          format: uuid
          nullable: true
          description: 質問と地点メモの跡のとき、その走行（分かれば）
        deletedAt:
          type: string
          format: date-time
